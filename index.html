<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Profile Card</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="profile-card">

        <div class="cover"></div>

        <div class="profile-image">
            <img src="sanskriti.jpeg" alt="Profile Picture">
        </div>

        <div class="profile-content">

            <h1>Sanskriti Srivastava</h1>

            <p class="username">@sanskriti</p>

            <p class="bio">
                AIML Student | Web Developer | AI Enthusiast 🚀
            </p>

            <div class="stats">

                <div>
                    <h3>24</h3>
                    <p>Projects</p>
                </div>

                <div>
                    <h3>1.2K</h3>
                    <p>Followers</p>
                </div>

                <div>
                    <h3>180</h3>
                    <p>Following</p>
                </div>

            </div>

            <div class="buttons">

                <button id="followBtn">
                    Follow
                </button>

                <button id="messageBtn" class="message">
                    Message
                </button>

            </div>

            <div class="social-links">

                <a href="#" title="GitHub">💻</a>
                <a href="#" title="LinkedIn">💼</a>
                <a href="#" title="Instagram">📸</a>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
